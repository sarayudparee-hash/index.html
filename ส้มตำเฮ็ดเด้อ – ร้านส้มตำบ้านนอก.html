<style>

html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun','Noto Sans Thai',sans-serif;font-size:14px}
body{max-width:780px;margin:auto;padding:6px}
canvas{width:100%;image-rendering:pixelated;border:3px solid var(--bd);border-radius:6px;display:block;background:#000}
.hud{display:flex;justify-content:space-between;gap:4px;font-weight:700;padding:4px 2px;flex-wrap:wrap}

.tabs button.on{background:var(--ac);color:#fff}

.b{border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:5px;padding:5px 8px;margin:2px;font:inherit}
.b.on{background:var(--ac);color:#fff}.b:disabled{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--bd);padding:4px 0}

S.tut=S.tut||0;S.ms=S.ms||{d:0};S.end=S.end||0;S.evN=S.evN||0;
function lawn(x,y,w,h){const p=pat('tgr2',22);if(p){g.fillStyle=p;g.fillRect(x,y,w,h)}else px(x,y,w,h,'#8cc860')}
function rtex(x,y,w,h){const l=S.up.road,p=pat(['tsa','tst','ra'][l],l==2?26:20);g.fillStyle=p||['#b58a55','#cfcabb','#4a4a50'][l];g.fillRect(x,y,w,h)}
function ui(){$('h1').innerHTML='<img src="'+SPR.coin+'" style="height:14px;vertical-align:-3px"> '+S.money+'฿';$('h2').textContent='📅'+S.day+' '+Math.floor(S.t/6)+'%';$('h3').textContent='⭐'+FM()+' ✨'+LUX()+' 🎫'+S.cp}
function dic(i){const r=REC[i],n=r[1]==9?['w1','w2','w6','w0','w7'][i%5]:r[1]==8?['w0','w7'][i%2]:'d'+(i%12);return SPR[n]?'<img src="'+SPR[n]+'" style="height:20px;vertical-align:-4px;margin-right:3px">':''}
const _p9=pay;pay=function(c){_p9(c);FT.push({x:c.x-9,y:c.y-44,t:40,s:['😊','❤️','😋','👍'][Math.random()*4|0]})};
const _ec=evClose;evClose=function(){S.evN++;_ec()};
const _bm=buy;buy=function(k){S.ms.b=(S.ms.b||0)+1;_bm(k)};
function mkMs(){S.ms={d:S.day,k0:S.known.length,ev:S.evN,b:0,l:[['sell','ขาย '+(8+S.day)+' จาน',8+S.day,80+10*S.day,'฿'],['earn','หารายได้วันนี้ '+(250+60*S.day)+'฿',250+60*S.day,120+15*S.day,'฿'],S.day%2?['new','ค้นพบสูตรใหม่ 1 สูตร',1,5,'🎫']:['ev','ตัดสินใจเหตุการณ์ 1 เรื่อง',1,2,'⭐'],['buy','ซื้อของที่ตลาด 3 ครั้ง',3,60,'฿']].map(a=>({t:a[0],n:a[1],g:a[2],r:a[3],u:a[4],done:0}))}}
const msP=m=>m.t=='sell'?S.served:m.t=='earn'?S.day$:m.t=='new'?S.known.length-S.ms.k0:m.t=='ev'?S.evN-S.ms.ev:S.ms.b;
function claimMs(i){const m=S.ms.l[i];if(m.done||msP(m)<m.g)return;m.done=1;if(m.u=='฿')S.money+=m.r;else if(m.u=='🎫')S.cp+=m.r;else S.fame+=m.r;toast('📋 ภารกิจสำเร็จ! +'+m.r+m.u);panel()}
function msHTML(){const m=S.ms;return '<b>📋 ภารกิจประจำวัน (วันที่ '+S.day+')</b>'+m.l.map((x,i)=>{const p=Math.min(msP(x),x.g);return `<div class="row"><span>${x.done?'✅':'🎯'} ${x.n}<br><small>${p}/${x.g} · รางวัล ${x.r}${x.u}</small></span>${x.done?'':`<button class="b" ${p<x.g?'disabled':''} onclick="claimMs(${i})">รับ</button>`}</div>`}).join('')+`<hr><b>🏁 เป้าหมายสูงสุด: ตำนานส้มตำ</b><br><small>ความนิยม ${FM()}/100 · สาขาต่างประเทศ ${S.br.filter(x=>x).length}/5 ${S.end?'· ✅ สำเร็จแล้ว!':''}</small>`}
TB.push('📋ภารกิจ');const _pn9=panel;panel=function(){if(S.tab==9){tabs();$('p').innerHTML=msHTML()}else _pn9()};
function endShow(){MOD=1;$('evc').innerHTML=`<div style="font-size:48px;text-align:center">🏆</div><div style="text-align:center"><b style="font-size:20px">${S.nm||'ส้มตำเฮ็ดเด้อ'} คือตำนานส้มตำ!</b></div><p>คุณพาร้านจากบ้านนอกไปทั่วโลกสำเร็จ<br>📅 ${S.day} วัน · 🍽️ ขาย ${sumv(S.sold)} จาน · 📚 รู้ ${S.known.length}/${REC.length} เมนู · 🌏 ${S.br.filter(x=>x).length} สาขา · 💰 ${S.money}฿</p><button class="b on" onclick="$('evm').className='';MOD=0">เล่นต่อแบบอิสระ</button>`;$('evm').className='on';S.money+=2000;S.cp+=20;beep()}
const TUT=[[()=>tick>40,'👋 ยินดีต้อนรับ! ไปแท็บ 🍳 ลองปรุงสูตรใหม่ดูนะ'],[()=>S.served>=1,'💰 ขายได้แล้ว! ซื้อวัตถุดิบเพิ่มที่แท็บ 🗺️ ตลาดนัด'],[()=>S.money>=300,'⬆️ เงินพอแล้ว ลองซื้อโต๊ะหรืออัปเกรดในแท็บ ⬆️'],[()=>S.day>=2,'📋 วันใหม่แล้ว! ดูภารกิจรายวันได้ที่แท็บ 📋']];
const _s9=step;step=function(){if(S.ms.d!=S.day)mkMs();if(!MOD){if(S.tut<TUT.length&&TUT[S.tut][0]()){toast(TUT[S.tut][1]);S.tut++}if(!S.end&&tick%60==0&&FM()>=100&&S.br.every(x=>x>0)){S.end=1;endShow()}}_s9()};
mkMs();panel();
